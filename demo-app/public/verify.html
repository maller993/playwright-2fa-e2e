<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your email · Demo Bank</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Check your email</h1>
    <p class="lead" id="sent-to"></p>
    <form id="verify">
      <label for="code">Verification code</label>
      <input id="code" name="code" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
      <p role="alert" id="error"></p>
      <button type="submit">Verify</button>
    </form>
    <button type="button" class="secondary" id="resend">Resend code</button>
    <p role="status" id="status"></p>
  </main>
  <script>
    const form = document.getElementById('verify');
    const error = document.getElementById('error');
    const status = document.getElementById('status');

    fetch('/api/pending').then(async (res) => {
      if (!res.ok) { location.href = '/'; return; }
      const { email } = await res.json();
      document.getElementById('sent-to').textContent = 'We sent a 6-digit code to ' + email;
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      status.textContent = '';
      const res = await fetch('/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: form.code.value }),
      });
      const data = await res.json();
      if (res.ok) location.href = data.next;
      else error.textContent = data.error;
    });

    document.getElementById('resend').addEventListener('click', async () => {
      error.textContent = '';
      status.textContent = '';
      const res = await fetch('/api/resend', { method: 'POST' });
      const data = await res.json();
      if (res.ok) status.textContent = data.message;
      else error.textContent = data.error;
    });
  </script>
</body>
</html>
